<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KarmaMap users</title>
  <link rel="icon" type="image/svg+xml" href="../icon.svg" />
  <link rel="stylesheet" href="../base.css" />

  <script type="importmap">
  {
    "imports": {
      "hyparquet": "https://cdn.jsdelivr.net/npm/hyparquet@1.30.1/+esm",
      "hyparquet-compressors": "https://cdn.jsdelivr.net/npm/hyparquet-compressors@1.1.1/+esm",
      "echarts": "https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.esm.min.js"
    }
  }
  </script>

  <style>
    html, body { background: var(--page-bg); }
    #controls { flex-wrap: wrap; }
    #status { margin-left: auto; }

    #profile {
      display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: center;
      padding: 0.75rem 1rem; background: var(--surface); border-bottom: 1px solid var(--border);
    }
    #profile .field strong { display: block; font-size: 0.75rem; color: var(--label); }
    #profile .field span { font-size: 0.95rem; }

    #score {
      display: flex; flex-direction: column; gap: 0.4rem;
      padding: 0.75rem 1rem; background: var(--header-bg); color: var(--surface);
    }
    #score .headline { display: flex; align-items: baseline; gap: 0.6rem; }
    #score .headline .value { font-size: 2rem; font-weight: 700; line-height: 1; }
    #score .headline .of { font-size: 0.9rem; color: var(--muted); }
    #score .note { font-size: 0.75rem; color: var(--muted); }
    .formula {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem; color: var(--code-fg); background: var(--code-bg); border: 1px solid var(--panel);
      border-radius: 6px; padding: 0.45rem 0.6rem; line-height: 1.5;
    }
    .formula-note { font-size: 0.7rem; color: var(--muted); }

    #scores {
      display: flex; flex-direction: column; gap: 1rem; padding: 1rem 1rem 0;
    }
    .score-group h3 { font-size: 0.9rem; margin: 0 0 0.2rem; color: var(--panel); }
    .score-group > .desc { font-size: 0.75rem; color: var(--label); margin: 0 0 0.6rem; }
    .counter-table {
      width: 100%; border-collapse: collapse; background: var(--surface);
      border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
    }
    .counter-table th {
      text-align: left; font-size: 0.7rem; text-transform: uppercase;
      color: var(--label); padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border);
      background: var(--surface-alt);
    }
    .counter-table th.value, .counter-table td.value { text-align: right; white-space: nowrap; }
    .counter-table td { padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border-light); font-size: 0.85rem; }
    .counter-table td.name .counter-name { font-weight: 600; }
    .counter-table td.name .count-desc { display: block; font-size: 0.75rem; color: var(--label); margin-top: 0.15rem; }
    .counter-table td.role, .counter-table th.role { font-size: 0.75rem; color: var(--muted); width: 9rem; }
    .counter-table tbody tr:last-child td { border-bottom: none; }

    #timeline { height: 260px; margin: 0 1rem 1rem; }
  </style>
</head>
<body>
  <div id="controls">
    <img src="../icon.svg" alt="" width="32" height="32" />
    <strong>KarmaMap</strong>

    <a href="../changes/">changes</a>
    <a href="../users/">users</a>

    <span class="divider"></span>

    <label for="username">OSM username</label>
    <input type="text" id="username" placeholder="e.g. alice" autocomplete="off" />
    <button id="search" type="button">Search</button>

    <span id="status">Loading...</span>
  </div>

  <div id="profile"></div>
  <div id="score"></div>
  <div id="scores"></div>
  <div id="timeline"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
