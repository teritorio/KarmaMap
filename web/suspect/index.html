<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KarmaMap suspects</title>
  <link rel="icon" type="image/svg+xml" href="../icon.svg" />
  <link rel="stylesheet" href="../base.css" />

  <script type="importmap">
  {
    "imports": {
      "hyparquet": "https://cdn.jsdelivr.net/npm/hyparquet@1.30.1/+esm",
      "hyparquet-compressors": "https://cdn.jsdelivr.net/npm/hyparquet-compressors@1.1.1/+esm"
    }
  }
  </script>

  <link rel="alternate" type="application/atom+xml" title="KarmaMap suspects" href="/data/suspect.atom">

  <style>
    html, body { background: var(--page-bg); }

    #table-wrap {
      margin: 1rem; background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px; overflow: auto;
    }
    table {
      width: 100%; border-collapse: collapse; font-size: 0.85rem;
    }
    th {
      text-align: left; font-size: 0.7rem; text-transform: uppercase;
      color: var(--label); padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--border);
      background: var(--surface-alt); position: sticky; top: 0; white-space: nowrap;
    }
    th.value, td.value { text-align: right; white-space: nowrap; }
    td { padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--border-light); white-space: nowrap; }
    tbody tr:last-child td { border-bottom: none; }
    td.user { font-weight: 600; }
    th:nth-child(2), td:nth-child(2) { width: 12rem; }
    td:nth-child(2) { white-space: normal; overflow-wrap: break-word; }
    th:nth-child(9), td:nth-child(9) { width: 24rem; }
    td:nth-child(9) { white-space: normal; overflow-wrap: break-word; }

    th .col-filter {
      display: block; width: 100%; box-sizing: border-box; margin-top: 0.25rem;
      font-size: 0.7rem; font-weight: normal; text-transform: none; letter-spacing: normal;
      padding: 0.2rem 0.35rem; border: 1px solid var(--border); border-radius: 4px;
      background: var(--surface); color: inherit;
    }

    /* Flag of the country picked in the Countries selector, shown on its own
       line so it stays readable next to the narrow select. */
    .country-flag { display: block; margin-top: 0.2rem; font-size: 1.1rem; line-height: 1.2; }
    .country-flag:empty { display: none; }

    @media (max-width: 40rem) {
      #table-wrap { margin: 0.5rem; }
      table, tbody, tr { display: block; }
      thead { display: none; }
      tbody tr { padding: 0.6rem 0.7rem; border-bottom: 1px solid var(--border); }
      tbody tr:last-child { border-bottom: none; }
      td, td.value {
        display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
        padding: 0.15rem 0; border-bottom: none; text-align: left; white-space: normal;
        overflow-wrap: break-word;
      }
      td::before {
        content: ""; flex: 0 0 auto;
        font-size: 0.7rem; text-transform: uppercase; color: var(--label);
      }
      td:nth-child(1)::before { content: "Date"; }
      td:nth-child(2)::before { content: "Countries"; }
      td:nth-child(3)::before { content: "Ranking at day"; }
      td:nth-child(4)::before { content: "User"; }
      td:nth-child(5)::before { content: "uid"; }
      td:nth-child(6)::before { content: "Changes"; }
      td:nth-child(7)::before { content: "Edits/h"; }
      td:nth-child(8)::before { content: "Name lang events"; }
      td:nth-child(9)::before { content: "Spread"; }
      td:nth-child(10)::before { content: "Mass tags"; }
      td:nth-child(11)::before { content: "Far moves"; }
      td:nth-child(12)::before { content: "Max move"; }
      td:nth-child(2) { width: auto; }
      td:nth-child(10) { width: auto; }
      td.user, td:nth-child(10) { display: block; }
      td.user { font-size: 0.95rem; }
      td.user::before, td:nth-child(10)::before { display: block; margin-bottom: 0.15rem; }
      td:empty::after { content: "\2014"; color: var(--label); }
    }
  </style>
</head>
<body>
  <div id="header">
    <div class="header-row">
      <a class="brand" href="../">
        <img src="../icon.svg" alt="" width="32" height="32" />
        <h1>KarmaMap</h1>
      </a>

      <nav class="header-nav" aria-label="Pages">
        <a href="../changes/">changes</a>
        <a href="../users/">users</a>
        <a href="../suspect/" aria-current="page">suspects</a>
      </nav>

      <span id="extract-info" class="extract-info"></span>
    </div>

    <div class="header-row">
      <p class="page-desc">
        <span class="page-desc-text">The 100 most recent user-days a review filter flagged, newest first, with the value each filter tripped on.</span>
        <a href="../how-it-works.html">Know more about it &rarr;</a>
      </p>
    </div>

    <div class="header-row">
      <span id="status">Loading...</span>
    </div>
  </div>

  <div id="table-wrap">
    <table id="suspect">
      <thead>
        <tr>
          <th>Date<br /><input class="col-filter" data-col="date" data-filter-type="date" type="date" aria-label="Filter Date" /></th>
          <th title="distinct countries the day's cells fall in">Countries<br />
            <select id="country-filter" class="col-filter" data-col="countries" data-filter-type="country" aria-label="Filter Countries">
              <option value="">All</option>
              <option value="__NONE__">None</option>
            </select>
            <span id="country-flag" class="country-flag"></span></th>
          <th class="value" title="ranking frozen at the day's first flag">Ranking at day<br />
            <input class="col-filter" data-col="ranking" data-filter-type="range" data-bound="min" type="number" placeholder="min" aria-label="Minimum Ranking at day" />
            <input class="col-filter" data-col="ranking" data-filter-type="range" data-bound="max" type="number" placeholder="max" aria-label="Maximum Ranking at day" /></th>
          <th>User<br /><input class="col-filter" data-col="user" data-filter-type="text" type="text" placeholder="filter" aria-label="Filter User" /></th>
          <th class="value">uid<br /><input class="col-filter" data-col="uid" data-filter-type="exact" type="text" placeholder="exact" aria-label="Filter uid" /></th>
          <th class="value">Changes<br /><input class="col-filter" data-col="changes" data-filter-type="min" type="number" placeholder="min" aria-label="Minimum Changes" /></th>
          <th class="value" title="busiest hour: &gt;500 modified/deleted fired the filter">Edits/h<br /><input class="col-filter" data-col="edits" data-filter-type="min" type="number" placeholder="min" aria-label="Minimum Edits per hour" /></th>
          <th class="value" title="objects whose name/* or wikipedia/* tags were mass-changed in an hour">Name lang events<br /><input class="col-filter" data-col="name_lang_events" data-filter-type="min" type="number" placeholder="min" aria-label="Minimum Name lang events" /></th>
          <th class="value" title="widest hour: 20+ edits across 3+ cells spanning 20 km&sup2; fired the filter">Spread<br /><input class="col-filter" data-col="spread" data-filter-type="min" type="number" placeholder="min km&sup2;" aria-label="Minimum Spread" /></th>
          <th title="tag keys on &gt;90% of an hour's &ge;100 modified/deleted objects">Mass tags<br /><input class="col-filter" data-col="tags" data-filter-type="text" type="text" placeholder="filter" aria-label="Filter Mass tags" /></th>
          <th class="value">Far moves<br /><input class="col-filter" data-col="farmoves" data-filter-type="min" type="number" placeholder="min" aria-label="Minimum Far moves" /></th>
          <th class="value" title="largest of those drags">Max move<br /><input class="col-filter" data-col="maxmove" data-filter-type="min" type="number" placeholder="min meters" aria-label="Minimum Max move" /></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
