<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KarmaMap suspects</title>
  <link rel="icon" type="image/svg+xml" href="../icon.svg" />
  <link rel="stylesheet" href="../base.css" />

  <script type="importmap">
  {
    "imports": {
      "hyparquet": "https://cdn.jsdelivr.net/npm/hyparquet@1.30.1/+esm",
      "hyparquet-compressors": "https://cdn.jsdelivr.net/npm/hyparquet-compressors@1.1.1/+esm"
    }
  }
  </script>

  <style>
    html, body { background: var(--page-bg); }

    #table-wrap {
      margin: 1rem; background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px; overflow: auto;
    }
    table {
      width: 100%; border-collapse: collapse; font-size: 0.85rem;
    }
    th {
      text-align: left; font-size: 0.7rem; text-transform: uppercase;
      color: var(--label); padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--border);
      background: var(--surface-alt); position: sticky; top: 0; white-space: nowrap;
    }
    th.value, td.value { text-align: right; white-space: nowrap; }
    td { padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--border-light); white-space: nowrap; }
    tbody tr:last-child td { border-bottom: none; }
    td.user { font-weight: 600; }
    /* A day can collect any number of mass-tag keys, so the list wraps inside a
       fixed-width column instead of stretching the row. The cap is a width on
       the cell, not a max-width: Chrome ignores max-width on a table-cell under
       table-layout: auto, and a width is a target the cell is laid out against. */
    th:nth-child(8), td:nth-child(8) { width: 24rem; }
    td:nth-child(8) { white-space: normal; overflow-wrap: break-word; }

    /* Narrow screens: the ten columns become one card per day, each value on its
       own labelled line. Every column keeps its line, a filter that did not fire
       showing a dash, so the cards line up between days. Each content string must
       match its column's <th>, or the card mislabels the value. */
    @media (max-width: 40rem) {
      #table-wrap { margin: 0.5rem; }
      table, tbody, tr { display: block; }
      thead { display: none; }
      tbody tr { padding: 0.6rem 0.7rem; border-bottom: 1px solid var(--border); }
      tbody tr:last-child { border-bottom: none; }
      td, td.value {
        display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
        padding: 0.15rem 0; border-bottom: none; text-align: left; white-space: normal;
        overflow-wrap: break-word;
      }
      td::before {
        content: ""; flex: 0 0 auto;
        font-size: 0.7rem; text-transform: uppercase; color: var(--label);
      }
      td:nth-child(1)::before { content: "Date"; }
      td:nth-child(2)::before { content: "Ranking at day"; }
      td:nth-child(3)::before { content: "User"; }
      td:nth-child(4)::before { content: "uid"; }
      td:nth-child(5)::before { content: "Changes"; }
      td:nth-child(6)::before { content: "Edits/h"; }
      td:nth-child(7)::before { content: "Spread"; }
      td:nth-child(8)::before { content: "Mass tags"; }
      td:nth-child(9)::before { content: "Far moves"; }
      td:nth-child(10)::before { content: "Max move"; }
      td:nth-child(8) { width: auto; }
      td.user, td:nth-child(8) { display: block; }
      td.user { font-size: 0.95rem; }
      td.user::before, td:nth-child(8)::before { display: block; margin-bottom: 0.15rem; }
      /* Every column keeps its line so the cards line up between days; a column
         whose filter did not fire shows a dash rather than vanishing. */
      td:empty::after { content: "\2014"; color: var(--label); }
    }
  </style>
</head>
<body>
  <div id="header">
    <div class="header-row">
      <a class="brand" href="../">
        <img src="../icon.svg" alt="" width="32" height="32" />
        <h1>KarmaMap</h1>
      </a>

      <nav class="header-nav" aria-label="Pages">
        <a href="../changes/">changes</a>
        <a href="../users/">users</a>
        <a href="../suspect/" aria-current="page">suspects</a>
      </nav>

      <span id="extract-info" class="extract-info"></span>
    </div>

    <div class="header-row">
      <p class="page-desc">
        <span class="page-desc-text">The 100 most recent user-days a review filter flagged, newest first, with the value each filter tripped on.</span>
        <a href="../how-it-works.html">Know more about it &rarr;</a>
      </p>
    </div>

    <div class="header-row">
      <span id="status">Loading...</span>
    </div>
  </div>

  <div id="table-wrap">
    <table id="suspect">
      <thead>
        <tr>
          <th>Date</th>
          <th class="value" title="ranking frozen at the day's first flag">Ranking at day</th>
          <th>User</th>
          <th class="value">uid</th>
          <th class="value">Changes</th>
          <th class="value" title="busiest hour: &gt;500 modified/deleted fired the filter">Edits/h</th>
          <th class="value" title="widest hour: 20+ edits across 3+ cells spanning 20 km&sup2; fired the filter">Spread</th>
          <th title="tag keys on &gt;90% of an hour's &ge;100 modified/deleted objects">Mass tags</th>
          <th class="value">Far moves</th>
          <th class="value" title="largest of those drags">Max move</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
