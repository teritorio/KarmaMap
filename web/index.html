<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KarmaMap</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="stylesheet" href="./base.css" />
  <style>
    html, body { background: var(--header-bg); color: white; }
    #wrap { max-width: 640px; margin: 0 auto; padding: 3rem 1rem; }
    h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
    p { color: var(--text-soft); margin: 0 0 2rem; }
    ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.75rem; }
    a { display: block; padding: 1rem; border-radius: 8px; background: var(--panel); color: white; text-decoration: none; }
    a:hover { background: var(--panel-hover); }
    strong { display: block; font-size: 1.05rem; }
    small { color: var(--muted); }
  </style>
</head>
<body>
  <div id="wrap">
    <h1><img src="./icon.svg" alt="" width="40" height="40" style="vertical-align: middle;" /> KarmaMap</h1>
    <p>Views over the OSM full-history change index dataset.</p>
    <ul>
      <li>
        <a href="./changes/">
          <strong>Changes</strong>
          <small>H3 cell map + daily histogram over the change dataset</small>
        </a>
      </li>
      <li>
        <a href="./users/">
          <strong>Users</strong>
          <small>Per-user history scores — search an OSM username</small>
        </a>
      </li>
      <li>
        <a href="./vandalism/">
          <strong>Vandalism</strong>
          <small>The 100 latest flagged days (OSMPatrol filters)</small>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
