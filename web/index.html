<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KarmaMap</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="stylesheet" href="./base.css" />
  <style>
    html, body { background: var(--header-bg); color: white; }
    #wrap { max-width: 640px; margin: 0 auto; padding: 3rem 1rem; }
    ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.75rem; }
    #wrap a { display: block; padding: 1rem; border-radius: 8px; background: var(--panel); color: white; text-decoration: none; }
    #wrap a:hover { background: var(--panel-hover); }
    #wrap strong { display: block; font-size: 1.05rem; }
    #wrap small { color: var(--muted); }
  </style>
</head>
<body>
  <div id="header">
    <div class="header-row">
      <a class="brand" href="./">
        <img src="./icon.svg" alt="" width="32" height="32" />
        <h1>KarmaMap</h1>
      </a>

      <nav class="header-nav" aria-label="Pages">
        <a href="./changes/">changes</a>
        <a href="./users/">users</a>
        <a href="./suspect/">suspects</a>
      </nav>
    </div>

    <div class="header-row">
      <p class="page-desc">
        <span class="page-desc-text">Views over the OSM full-history change index dataset.</span>
        <a href="./how-it-works.html">Know more about it &rarr;</a>
      </p>
    </div>
  </div>

  <div id="wrap">
    <ul>
      <li>
        <a href="./changes/">
          <strong>Changes</strong>
          <small>H3 cell map + daily histogram over the change dataset</small>
        </a>
      </li>
      <li>
        <a href="./users/">
          <strong>Users</strong>
          <small>Per-user history scores — search an OSM username</small>
        </a>
      </li>
      <li>
        <a href="./suspect/">
          <strong>Suspects</strong>
          <small>The 100 latest flagged days (OSMPatrol filters)</small>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
