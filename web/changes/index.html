<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KarmaMap viewer</title>
  <link rel="icon" type="image/svg+xml" href="../icon.svg" />
  <link rel="stylesheet" href="../base.css" />

  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.9.0/dist/maplibre-gl.css" rel="stylesheet" />

  <script type="importmap">
  {
    "imports": {
      "hyparquet": "https://cdn.jsdelivr.net/npm/hyparquet@1.30.1/+esm",
      "hyparquet-compressors": "https://cdn.jsdelivr.net/npm/hyparquet-compressors@1.1.1/+esm",
      "h3-js": "https://cdn.jsdelivr.net/npm/h3-js@4.5.0/+esm",
      "maplibre-gl": "https://cdn.jsdelivr.net/npm/maplibre-gl@6.9.0/+esm",
      "echarts": "https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.esm.min.js"
    }
  }
  </script>

  <style>
    #app { display: flex; flex-direction: column; height: 100%; }
    #map { flex: 1; }

    #histogram {
      height: 140px;
      width: 100%;
      display: block;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <div class="header-row">
        <a class="brand" href="../">
          <img src="../icon.svg" alt="" width="32" height="32" />
          <h1>KarmaMap</h1>
        </a>

        <nav class="header-nav" aria-label="Pages">
          <a href="../changes/" aria-current="page">changes</a>
          <a href="../users/">users</a>
          <a href="../suspect/">suspects</a>
        </nav>

        <span id="extract-info" class="extract-info"></span>
      </div>

      <div class="header-row">
        <p class="page-desc">
          <span class="page-desc-text">Every map edit, by hex cell and by day.</span>
          <a href="../how-it-works.html">Know more about it &rarr;</a>
        </p>
      </div>

      <div class="header-row">
        <div class="page-options" id="page-options">
          <label for="start-date">From</label>
          <input type="date" id="start-date" />

          <label for="end-date">To</label>
          <input type="date" id="end-date" />

          <span class="divider"></span>

          <label for="log-scale"><input type="checkbox" id="log-scale" checked /> Log scale</label>
        </div>

        <span id="status">Loading...</span>
      </div>
    </div>
    <div id="histogram"></div>
    <div id="map"></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
