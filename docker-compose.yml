services:
  # No default command: pass arguments explicitly, e.g.
  #   docker compose run --rm osh_change_index osh_change_index \
  #     --input /data/input/region.osh.pbf --node-cache /data/node_positions.cache --output-dir /data/output
  #
  # Host paths are read from .env (copy .env.template to .env to override).
  # They default to ./data/... under the current directory when unset.
  osh_change_index:
    profiles:
      - build
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ${DATA_DIR:-./data/}:/data

  # Serves output-dir/ (Parquet partitions + manifest.json, port 8080) and
  # the static frontend under web/ (port 8081), both with range-request
  # support and permissive CORS - what a browser-side Parquet reader
  # (hyparquet) needs to query data directly, no application backend.
  caddy:
    image: caddy:2
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${OUTPUT_DIR:-./data/output}:/srv/output:ro
      - ./web:/srv/web:ro
    ports:
      - "8080:8080"
      - "8081:8081"
