services:
  # No default command: pass arguments explicitly, e.g.
  #   docker compose run --rm karmamap karmamap \
  #     import /data/input/region.osh.pbf --node-cache /data/node_positions.cache --output-dir /data/output
  #
  # Host paths are read from .env (copy .env.template to .env to override).
  # They default to ./data/... under the current directory when unset.
  karmamap:
    profiles:
      - build
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # OSM account for osm-internal.download.geofabrik.de; used by
      # karmamap itself to obtain/refresh the internal session cookie.
      OSM_GEOFABRIK_USER: ${OSM_GEOFABRIK_USER:-}
      OSM_GEOFABRIK_PASSWORD: ${OSM_GEOFABRIK_PASSWORD:-}
    volumes:
      - ${DATA_DIR:-./data/}:/data

  # Serves both on one port (8080): web/ at the root (the landing page at /,
  # the changes viewer at /changes/, the users viewer at /users/) and
  # output-dir/ (Parquet partitions + manifest.json) under /data/ — all with
  # range-request support and permissive CORS on the data path, what a
  # browser-side Parquet reader (hyparquet) needs to query data directly,
  # no application backend.
  caddy:
    image: caddy:2
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-./data/}output:/srv/output:ro
      - ./web:/srv/web:ro
    ports:
      - "8080:8080"
